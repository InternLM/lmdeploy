              pytest autotest/interface/restful/test_restful_generate.py -n 20 -k 'Qwen/Qwen3-32B and turbomind' -m 'not not_turbomind and not experts' --alluredir=${{env.REPORT_DIR}}
              curl -f -s http://127.0.0.1:23333/nodes/remove -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:23402"}' > /dev/null 2>&1 || true
              curl -f -s http://127.0.0.1:23402/terminate > /dev/null 2>&1
              wait $restful_pid
              exit 0
            fi
