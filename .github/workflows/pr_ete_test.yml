name: pr_ete_test

on:
  pull_request:
    paths:
      - ".github/workflows/pr_ete_test.yml"
      - "cmake/**"
      - "src/**"
      - "autotest/**"
      - "3rdparty/**"
      - "lmdeploy/**"
      - "requirements/**"
      - "requirements_cuda.txt"
      - "CMakeLists.txt"
      - "setup.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


env:
  HOST_PIP_CACHE_DIR: /nvme/github-actions/pip-cache
  HOST_LOCALTIME: /usr/share/zoneinfo/Asia/Shanghai
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  PYTHONPATH: /nvme/qa_test_models/offline_pkg/LLaVA


jobs:
  pr_functions_test:
    runs-on: [self-hosted, linux-a100-pr]
    timeout-minutes: 120
    env:
      REPORT_DIR: /nvme/qa_test_models/test-reports/${{ github.head_ref }}_${{ github.run_id }}
      SERVER_LOG: /nvme/qa_test_models/server_log/${{ github.head_ref }}_${{ github.run_id }}
    container:
      image: openmmlab/lmdeploy:dev-cu12.8
      options: --gpus all --ipc=host --user root -e PIP_CACHE_DIR=/root/.cache/pip --pull never
      volumes:
        - /nvme/share_data/github-actions/pip-cache:/root/.cache/pip
        - /nvme/share_data/github-actions/packages:/root/packages
        - /nvme/qa_test_models:/nvme/qa_test_models
        - /mnt/121:/mnt/121
        - /mnt/104:/mnt/104
        - /mnt/bigdisk:/mnt/bigdisk
        - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install lmdeploy
        run: |
          python3 -m pip install --upgrade -r requirements/runtime_cuda.txt
          python3 -m pip install -r requirements/lite.txt
          python3 -m pip install -r requirements/test.txt
          python3 -m pip install -e .
          python3 -m pip install -e lmdeploy/router
      - name: Check env
        run: |
          python3 -m pip list
          lmdeploy check_env
          mkdir ${{env.REPORT_DIR}} -p
          mkdir ${{env.SERVER_LOG}} -p
          echo "starttime=$(date +%s)" > ${{env.REPORT_DIR}}/status.txt
      - name: Test lmdeploy - func
        run: |
          pytest autotest -m 'pr_test and gpu_num_2' -x --alluredir=${{env.REPORT_DIR}} --clean-alluredir
          pytest autotest -m 'pr_test and gpu_num_1' -n 2 -x --alluredir=${{env.REPORT_DIR}}
      - name: Start lmdeploy-router
        run: |
          lmdeploy-router --host 127.0.0.1 --port 23333 --policy cache_aware > ${{env.SERVER_LOG}}/router.log 2>&1 &
          router_pid=$!
          for i in $(seq 1 30)
          do
            sleep 1
            if curl -f -s http://127.0.0.1:23333/health > /dev/null 2>&1; then
              echo "lmdeploy-router is ready"
              exit 0
            fi
          done
          echo "lmdeploy-router failed to start"
          cat ${{env.SERVER_LOG}}/router.log
          exit 1
      - name: Test restful server - pytorch Qwen3.5-35B-A3B
        run: |
          CUDA_VISIBLE_DEVICES=6,7 lmdeploy serve api_server /nvme/qa_test_models/Qwen/Qwen3.5-35B-A3B --server-name 127.0.0.1 --server-port 23401 --tp 2 --backend pytorch --logprobs-mode raw_logprobs --enable-return-routed-experts --reasoning-parser qwen-qwq --tool-call-parser qwen3coder --speculative-algorithm qwen3_5_mtp --speculative-num-draft-tokens 4 --max-batch-size 256 --allow-terminate-by-client --proxy-url http://127.0.0.1:23333 > ${{env.SERVER_LOG}}/pytorch_Qwen3.5-35B-A3B_start_restful.log 2>&1 &
          echo "restful_pid=$!"
          for i in $(seq 1 180)
          do
            sleep 5
            echo "health check try $i"
            if curl -f -s http://127.0.0.1:23401/health > /dev/null 2>&1 && \
               curl -f -s http://127.0.0.1:23333/nodes/status | grep -q 'http://127.0.0.1:23401'; then
              pytest autotest/interface/restful/test_restful_chat_completions_v1.py -n 20 -k 'Qwen/Qwen3.5-35B-A3B and pytorch and not Qwen/Qwen3.5-35B-A3B-FP8' -m 'not not_pytorch and pr_test' --alluredir=${{env.REPORT_DIR}}
              pytest autotest/interface/restful/test_restful_generate.py -n 20 -k 'Qwen/Qwen3.5-35B-A3B and pytorch and not Qwen/Qwen3.5-35B-A3B-FP8' -m 'not not_pytorch' --alluredir=${{env.REPORT_DIR}}
              pytest autotest/interface/restful/tool_parser/test_tool_call_basic.py -n 20 -k 'Qwen/Qwen3.5-35B-A3B and pytorch and not Qwen/Qwen3.5-35B-A3B-FP8' --alluredir=${{env.REPORT_DIR}}
              curl -f -s http://127.0.0.1:23333/nodes/remove -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:23401"}' > /dev/null 2>&1 || true
              curl -f -s http://127.0.0.1:23401/terminate > /dev/null 2>&1
              wait $restful_pid
              exit 0
            fi
          done

          echo "health check fail"
          curl -f -s http://127.0.0.1:23401/terminate > /dev/null 2>&1
          wait $restful_pid
          cat ${{env.SERVER_LOG}}/pytorch_Qwen3.5-35B-A3B_start_restful.log
          exit 1
      - name: Start lmdeploy-router for PD
        run: |
          lmdeploy-router --host 127.0.0.1 --port 23410 --policy round_robin --lmdeploy-pd-disaggregation > ${{env.SERVER_LOG}}/pd_router.log 2>&1 &
          pd_router_pid=$!
          for i in $(seq 1 30)
          do
            sleep 1
            if curl -f -s http://127.0.0.1:23410/health > /dev/null 2>&1; then
              echo "PD lmdeploy-router is ready"
              exit 0
            fi
          done
          echo "PD lmdeploy-router failed to start"
          cat ${{env.SERVER_LOG}}/pd_router.log
          exit 1
      - name: Test restful server - pytorch pd Qwen3.5-35B-A3B
        run: |
          CUDA_VISIBLE_DEVICES=6,7 lmdeploy serve api_server /nvme/qa_test_models/Qwen/Qwen3.5-35B-A3B --server-name 127.0.0.1 --server-port 23411 --tp 2 --backend pytorch --role Prefill --migration-backend Mooncake --proxy-url http://127.0.0.1:23410 > ${{env.SERVER_LOG}}/pytorch_pd_Qwen3.5-35B-A3B_prefill.log 2>&1 &
          prefill_pid=$!
          CUDA_VISIBLE_DEVICES=4,5 lmdeploy serve api_server /nvme/qa_test_models/Qwen/Qwen3.5-35B-A3B --server-name 127.0.0.1 --server-port 23412 --tp 2 --backend pytorch --role Decode --migration-backend Mooncake --proxy-url http://127.0.0.1:23410 > ${{env.SERVER_LOG}}/pytorch_pd_Qwen3.5-35B-A3B_decode.log 2>&1 &
          decode_pid=$!
          for i in $(seq 1 240)
          do
            sleep 5
            echo "health check try $i"
            if curl -f -s http://127.0.0.1:23411/health > /dev/null 2>&1 && \
               curl -f -s http://127.0.0.1:23412/health > /dev/null 2>&1 && \
               curl -f -s http://127.0.0.1:23410/nodes/status | grep -q 'http://127.0.0.1:23411' && \
               curl -f -s http://127.0.0.1:23410/nodes/status | grep -q 'http://127.0.0.1:23412'; then
              LMDEPLOY_PORT=23410 pytest autotest/interface/restful/test_restful_chat_completions_v1.py -n 8 -k 'Qwen/Qwen3.5-35B-A3B and pytorch and not Qwen/Qwen3.5-35B-A3B-FP8' -m 'not not_pytorch and pr_test' --alluredir=${{env.REPORT_DIR}}
              LMDEPLOY_PORT=23410 pytest autotest/interface/restful/test_restful_generate.py -n 8 -k 'Qwen/Qwen3.5-35B-A3B and pytorch and not Qwen/Qwen3.5-35B-A3B-FP8' -m 'not not_pytorch' --alluredir=${{env.REPORT_DIR}}
              LMDEPLOY_PORT=23410 pytest autotest/interface/restful/tool_parser/test_tool_call_basic.py -n 8 -k 'Qwen/Qwen3.5-35B-A3B and pytorch and not Qwen/Qwen3.5-35B-A3B-FP8' --alluredir=${{env.REPORT_DIR}}
              curl -f -s http://127.0.0.1:23410/nodes/remove -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:23412"}' > /dev/null 2>&1 || true
              curl -f -s http://127.0.0.1:23410/nodes/remove -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:23411"}' > /dev/null 2>&1 || true
              curl -f -s http://127.0.0.1:23412/terminate > /dev/null 2>&1
              curl -f -s http://127.0.0.1:23411/terminate > /dev/null 2>&1
              wait $prefill_pid
              wait $decode_pid
              exit 0
            fi
          done

          echo "health check fail"
          curl -f -s http://127.0.0.1:23412/terminate > /dev/null 2>&1
          curl -f -s http://127.0.0.1:23411/terminate > /dev/null 2>&1
          wait $prefill_pid
          wait $decode_pid
          cat ${{env.SERVER_LOG}}/pytorch_pd_Qwen3.5-35B-A3B_prefill.log
          cat ${{env.SERVER_LOG}}/pytorch_pd_Qwen3.5-35B-A3B_decode.log
          exit 1
      - name: Stop lmdeploy-router for PD
        run: kill "$pd_router_pid"
      - name: Test restful server - turbomind Qwen3-32B
        run: |
          CUDA_VISIBLE_DEVICES=6,7 lmdeploy serve api_server /nvme/qa_test_models/Qwen/Qwen3-32B --server-name 127.0.0.1 --server-port 23402 --tp 2 --backend turbomind --logprobs-mode raw_logprobs --allow-terminate-by-client --proxy-url http://127.0.0.1:23333 > ${{env.SERVER_LOG}}/turbomind_Qwen3-32B_start_restful.log 2>&1 &
          echo "restful_pid=$!"
          for i in $(seq 1 180)
          do
            sleep 5
            echo "health check try $i"
            if curl -f -s http://127.0.0.1:23402/health > /dev/null 2>&1 && \
