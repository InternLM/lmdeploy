name: router-test

on:
  pull_request:
    paths:
      - ".github/workflows/router_test.yml"
      - "lmdeploy/router/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/router_test.yml"
      - "lmdeploy/router/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lmdeploy/router
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lmdeploy/router
      - name: Check formatting
        run: cargo fmt --check
      - name: Static analysis
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets --locked

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lmdeploy/router
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e .[dev]
      - name: Python unit tests
        run: python -m pytest py_test/unit
      - name: Python mock integration tests
        run: python -m pytest py_test/integration -m 'integration and not pd_engine'
