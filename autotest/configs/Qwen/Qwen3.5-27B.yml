# HF model id: Qwen/Qwen3.5-27B

a100:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 2
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
  interface:
    pytorch:
      suites:
      - base
      - logprob
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
    turbomind:
      suites:
      - base
      - logprob
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
  quantization:
    turbomind:
    - kvint8
    pytorch:
    - kvint8
h:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 2
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - evaluate
  - func
  - longtext_benchmark
  - mllm_evaluate
  - quantization
  interface:
    pytorch:
      suites:
      - base
      - logprob
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
    turbomind:
      suites:
      - base
      - logprob
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
  quantization:
    turbomind:
    - awq
  gen_config:
    temperature: 1.0
    top-k: 20
    repetition-penalty: 1.0
    top-p: 0.95
    chat-template-kwargs:
      enable_thinking: true
- model_type:
  - chat
  - vl
  engine_config:
    tp: 2
    extra:
      prefix-cache-state-budget: 256
      prefix-cache-decode-state-interval: 1024
      max-prefill-token-num: 64
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - prefix_cache
  gen_config:
    temperature: 1.0
    top-k: 20
    repetition-penalty: 1.0
    top-p: 0.95
    chat-template-kwargs:
      enable_thinking: true
