# HF model id: Qwen/Qwen3.5-35B-A3B-FP8

a100:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 1
  backends:
  - name: turbomind
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - evaluate
  - func
  - longtext_benchmark
  - longtext_evaluate
  - mllm_evaluate
  interface:
    turbomind:
    - suites:
      - base
      - logprob
      - toolcall
      - reasoning
      extra:
        logprobs-mode: raw_logprobs
        tool-call-parser: qwen3coder
        reasoning-parser: default
    - suites:
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
    - suites:
      - abort
      extra:
        enable-abort-handling: true
