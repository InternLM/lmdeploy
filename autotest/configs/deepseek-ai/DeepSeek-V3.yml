# HF model id: deepseek-ai/DeepSeek-V3

h:
- model_type: chat
  engine_config:
    tp: 16
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
  interface:
    pytorch:
    - suites:
      - base
      - logprob
      - toolcall
      - hard_schema
      extra:
        logprobs-mode: raw_logprobs
        enable-return-routed-experts: true
        tool-call-parser: deepseek-v32
        reasoning-parser: deepseek-v3
- model_type: chat
  engine_config:
    tp: 16
    extra:
      speculative-algorithm: deepseek_mtp
      speculative-num-draft-tokens: 3
      max-batch-size: 128
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
