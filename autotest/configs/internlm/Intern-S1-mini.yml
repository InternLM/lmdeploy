# HF model id: internlm/Intern-S1-mini

a100:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 1
  backends:
  - name: turbomind
    communicators:
    - nccl
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - func
  - longtext_benchmark
  - mllm_evaluate
  - prefix_cache
  - quantization
  interface:
    pytorch:
    - suites:
      - base
      - logprob
      - toolcall
      - hard_schema
      extra:
        logprobs-mode: raw_logprobs
        enable-return-routed-experts: true
        tool-call-parser: intern-s1
        reasoning-parser: default
    turbomind:
    - suites:
      - base
      - logprob
      - toolcall
      - hard_schema
      extra:
        logprobs-mode: raw_logprobs
        tool-call-parser: intern-s1
        reasoning-parser: default
  quantization:
    turbomind:
    - kvint4
    - kvint8
    pytorch:
    - kvint4
    - kvint8
