# HF model id: internlm/Intern-S1

a100:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 8
    extra:
      cache-max-entry-count: 0.6
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - func
  - mllm_evaluate
  - prefix_cache
  - quantization
  quantization:
    turbomind:
    - kvint8
    pytorch:
    - kvint8
h:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 4
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - func
  - mllm_evaluate
  - prefix_cache
  interface:
    pytorch:
    - suites:
      - base
      - logprob
      - toolcall
      - reasoning
      extra:
        logprobs-mode: raw_logprobs
        enable-return-routed-experts: true
        tool-call-parser: intern-s1
        reasoning-parser: default
    - suites:
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
    turbomind:
    - suites:
      - base
      - logprob
      - toolcall
      - reasoning
      extra:
        logprobs-mode: raw_logprobs
        tool-call-parser: intern-s1
        reasoning-parser: default
    - suites:
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
  quantization:
    turbomind:
    - kvint8
    pytorch:
    - kvint8
ascend:
- model_type: vl
  engine_config:
    tp: 16
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - func
