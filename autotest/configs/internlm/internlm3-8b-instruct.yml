# HF model id: internlm/internlm3-8b-instruct

h:
- model_type: chat
  engine_config:
    tp: 1
  backends:
  - name: turbomind
    communicators:
    - nccl
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
  interface:
    pytorch:
    - suites:
      - base
      - logprob
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
    - suites:
      - toolcall
      - hard_schema
      extra:
        tool-call-parser: internlm
    turbomind:
    - suites:
      - base
      - logprob
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
    - suites:
      - toolcall
      - hard_schema
      extra:
        tool-call-parser: internlm
