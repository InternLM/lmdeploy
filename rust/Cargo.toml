[workspace]
members = [
    "crates/turbomind-sys",
    "crates/turbomind-runtime",
    "crates/lmdeploy-parser",
    "crates/lmdeploy-serving",
    "crates/rust-api-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.8"
bytes = "1.12.0"
futures = "0.3.31"
http = "1.3.1"
http-body-util = "0.1.4"
minijinja = { version = "2.0", features = ["builtins", "json", "loader", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2.0", features = ["pycompat"] }
prometheus-client = "0.24.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokenizers = "0.22.0"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.8", features = ["auth", "cors", "trace"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.22.0", features = ["v4"] }

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"
